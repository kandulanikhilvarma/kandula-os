line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = [
  "B008",  # Field(...) in a default is the documented pydantic idiom
]

[lint.per-file-ignores]
"tests/*" = ["ARG"]  # fixtures are requested by name, not always used in the body
