<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Kandula OS — your memory in plain text, your day at a glance">
  <title>Kandula OS</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="0.55" stop-color="#f4f0e7"/>
      <stop offset="1" stop-color="#efe9dd"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bd5732" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#bd5732" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#78603c" fill-opacity="0.05"/>
      <circle cx="12" cy="12" r="1" fill="#78603c" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#paper)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grain)"/>
  <circle cx="150" cy="110" r="240" fill="url(#wash)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="20" fill="none" stroke="#ddd4c2" stroke-width="1.5"/>

  <!-- mark: the K that folds into an elephant — stem, ear, trunk -->
  <g transform="translate(72 102) scale(2.05)">
    <g fill="none" stroke="#bd5732" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 4 V38"/>
      <path d="M8 22 L29 4"/>
      <path d="M8 22 C20 25 29 30 29 36 C29 40 24 40 23 36"/>
    </g>
  </g>

  <!-- wordmark: serif figures for a system you read by hand -->
  <text x="176" y="150" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-size="66" font-weight="600" letter-spacing="-1" fill="#211c15">Kandula<tspan font-style="italic" fill="#bd5732"> OS</tspan></text>
  <text x="180" y="190" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="18" letter-spacing="0.4" fill="#6a6053">Your memory in plain text. Your day at a glance.</text>

  <!-- pipeline motif: the one direction data flows -->
  <g font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#6a6053">
    <g fill="#fffdf7" stroke="#ddd4c2" stroke-width="1.5">
      <rect x="180" y="232" width="152" height="48" rx="10"/>
      <rect x="380" y="232" width="152" height="48" rx="10"/>
      <rect x="580" y="232" width="152" height="48" rx="10"/>
      <rect x="780" y="232" width="152" height="48" rx="10"/>
    </g>
    <text x="256" y="261" text-anchor="middle">TASKS.md</text>
    <text x="456" y="261" text-anchor="middle">sync</text>
    <text x="656" y="261" text-anchor="middle">Firestore</text>
    <text x="856" y="261" text-anchor="middle" fill="#bd5732">dashboard</text>
    <g stroke="#c7bca4" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M338 256 H374"/><path d="M368 251 L374 256 L368 261"/>
      <path d="M538 256 H574"/><path d="M568 251 L574 256 L568 261"/>
      <path d="M738 256 H774"/><path d="M768 251 L774 256 L768 261"/>
    </g>
  </g>

  <!-- badges strip -->
  <g font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#988d7a" text-anchor="end">
    <text x="1128" y="252">Flask · Firestore · Vercel</text>
    <text x="1128" y="274">zero frameworks · zero build step</text>
  </g>
</svg>
