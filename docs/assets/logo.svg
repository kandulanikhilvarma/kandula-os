<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kandula OS">
  <title>Kandula OS</title>
  <defs>
    <linearGradient id="kos-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2029"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#kos-tile)" stroke="#2b3340" stroke-width="1.5"/>
  <g fill="none" stroke="#d97757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
