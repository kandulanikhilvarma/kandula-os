name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Task file format
        run: python scripts/sync_state.py --check

      - name: Diagrams render on GitHub
        run: python scripts/check_mermaid.py

      - name: No secrets committed
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.env\.example'; then
            echo "A .env file is tracked. Remove it and rotate the secrets."
            exit 1
          fi
          echo "No tracked .env files."
